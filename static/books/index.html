<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的书架</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2e2a23; --muted:#978b78;
  --accent:#a3541f; --accent-soft:#f3e4d3; --line:#e7dcc6;
  --green:#4a7c59; --red:#b0483a; --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.6;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 90px;}
header.top{position:sticky;top:0;z-index:10;background:rgba(246,241,231,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
header.top .inner{max-width:720px;margin:0 auto;padding:14px 16px 10px;}
h1{font-size:22px;margin:0;display:flex;align-items:center;gap:8px;}
.stats{color:var(--muted);font-size:13px;margin-top:4px;}
.searchrow{display:flex;gap:8px;margin-top:10px;}
.searchrow input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
  font-size:15px;background:#fff;outline:none;}
.searchrow input:focus{border-color:var(--accent);}
.btn{border:none;border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600;white-space:nowrap;}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn.small{padding:6px 12px;font-size:13px;}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.book-card{cursor:pointer;}
.book-card:active{transform:scale(.99);}
.book-title{font-size:18px;font-weight:700;margin:0 0 4px;}
.book-meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.badge.done{background:#e2ecdf;color:var(--green);}
.badge.drop{background:#f0ddd8;color:var(--red);}
.stars{color:#d99a2b;letter-spacing:2px;font-size:14px;}
.book-head{display:flex;gap:14px;align-items:flex-start;}
.book-cover{width:64px;height:90px;object-fit:cover;border-radius:8px;flex:none;
  border:1px solid var(--line);background:#eef0f3;display:block;}
.book-cover.lg{width:110px;height:156px;}
.book-cover.ph{display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11px;color:var(--muted);padding:6px;line-height:1.5;
  background:linear-gradient(135deg,#e9edf2,#d5dbe4);}
.cover-preview{width:88px;height:124px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
.excerpt{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin:18px 0;}
.excerpt .quote{font-size:16px;}
.excerpt .ref{color:var(--muted);font-size:13px;margin-top:6px;}
.excerpt .note{margin-top:10px;background:#faf6ec;border-radius:10px;padding:10px 12px;font-size:15px;}
.excerpt .note::before{content:"✎ 我的笔记";display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.excerpt .ops{margin-top:8px;display:flex;gap:8px;}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;}
.linkbtn.danger{color:var(--red);}
.backbtn{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;padding:8px 0;font-weight:600;}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:600px){.modal-mask{align-items:center;}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:20px 18px 28px;}
@media(min-width:600px){.modal{border-radius:20px;}}
.modal h2{margin:0 0 14px;font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;font-size:15px;
  border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{min-height:90px;resize:vertical;}
.field textarea.tall{min-height:140px;}
.field .help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7;}
.starpick{display:flex;gap:6px;font-size:28px;}
.starpick span{cursor:pointer;color:#ddd;}
.starpick span.on{color:#d99a2b;}
.modal .btnrow{justify-content:flex-end;margin-top:18px;}
.daterow{display:flex;gap:10px;}
.daterow .field{flex:1;}
footer.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;padding:0 20px;}
.hiddenfile{display:none;}
.tagrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.tagpill{font-size:13px;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer;}
.tagpill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.tagpill .n{opacity:.65;font-size:11px;}
.booktags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.booktags .t{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px;}
.statbox{background:#faf6ec;border-radius:12px;padding:14px 8px;text-align:center;}
.statbox .v{font-size:26px;font-weight:800;}
.statbox .l{font-size:12px;color:var(--muted);margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px;}
.bar-row .bl{width:70px;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .bt{flex:1;background:#efe8d8;border-radius:6px;height:14px;overflow:hidden;}
.bar-row .bf{height:100%;background:var(--accent);border-radius:6px;}
.bar-row .bv{width:32px;text-align:right;color:var(--muted);}
</style>
</head>
<body>
<header class="top"><div class="inner">
  <h1>📚 我的书架</h1>
  <div class="stats"><span id="statsText"></span> · <span id="syncDot"></span></div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="搜索书名 / 作者 / 摘抄 / 笔记…" autocomplete="off">
  </div>
  <div class="btnrow" id="topbtns">
    <button class="btn small" id="addBookBtn">＋ 添加图书</button>
    <button class="btn small ghost" id="statsBtn">📊 统计</button>
    <button class="btn small ghost" id="syncBtn">☁️ 同步设置</button>
    <button class="btn small ghost" id="exportBtn">备份导出</button>
    <button class="btn small ghost" id="importBtn">导入恢复</button>
    <input type="file" id="importFile" class="hiddenfile" accept=".json,application/json">
  </div>
</div></header>

<div class="wrap">
  <div id="shelfView"></div>
  <div id="bookView" style="display:none"></div>
  <footer class="hint">配置云端同步后，数据自动存到你的 GitHub 私有仓库；没配之前先存在本机浏览器，记得用「备份导出」。Kindle 标注可<a href="/books/kindle-export.html" style="color:var(--accent)">从这里导出</a>后用「导入恢复」导入。</footer>
</div>

<div id="modalRoot"></div>

<script>
"use strict";
const KEY = "bookshelf.v1";
const CFG_KEY = "bookshelf.cfg";
let db = load() || { books: [] };
let cfg = loadCfg();
let currentBookId = null;
let selectedTag = "";

function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  schedulePush();
}
function loadCfg(){ try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch(e){ return {}; } }
function saveCfg(){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 封面：有 cover 显示图片，加载失败或无封面时显示标题占位图 */
function coverHTML(b, cls){
  const c = "book-cover" + (cls ? " " + cls : "");
  const ph = `<div class="${c} ph"${b.cover?` style="display:none"`:""}><span>${esc((b.title||"").slice(0,14))}</span></div>`;
  if(!b.cover) return ph;
  return `<img class="${c}" src="${esc(b.cover)}" alt="封面" loading="lazy" ` +
    `onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${ph}`;
}
const STATUS = { reading:"在读", done:"已读完", dropped:"弃读" };

/* ---------- 云端同步 (GitHub 私有仓库) ---------- */
let remoteSha = null;
let syncState = "off";
const ghConfigured = () => !!(cfg.token && cfg.repo);
function ghPath(){ return (cfg.path || "bookshelf.json").replace(/^\/+/,""); }
function ghOwner(){ return cfg.owner || "yyh0422"; }

function setSyncStatus(s, msg){
  syncState = s;
  const el = document.getElementById("syncDot");
  const map = {
    off:     ["⚪","未配置云端同步"],
    syncing: ["🔄","同步中…"],
    ok:      ["🟢","已同步到云端"],
    error:   ["🔴", msg || "同步失败，点☁️检查设置"]
  };
  const m = map[s] || map.off;
  if(el) el.textContent = m[0] + " " + m[1];
}
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g,"")))); }

async function ghApiFor(path, method, body){
  const url = `https://api.github.com/repos/${ghOwner()}/${cfg.repo}/contents/${path}`;
  const r = await fetch(url, {
    method: method || "GET",
    headers: { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if(r.status === 404) return { notFound: true };
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function ghApi(method, body){ return ghApiFor(ghPath(), method, body); }

/* 分卷存储：主卷 bookshelf.json + 附加卷 bookshelf_p2.json…，按 id 去重合并。
   任一分卷拉取失败即视为未完整加载（fullLoadOk=false），pushNow 会拒绝推送，
   避免半份数据覆盖云端。 */
let fullLoadOk = false;
let loadedParts = [];
function partPath(i){
  const base = ghPath().replace(/\.json$/i, "");
  return base + "_p" + i + ".json";
}
async function pullRemote(){
  if(!ghConfigured()){ setSyncStatus("off"); fullLoadOk = false; return false; }
  setSyncStatus("syncing");
  fullLoadOk = false; loadedParts = [];
  try{
    const d = await ghApi("GET");
    if(d.notFound){ remoteSha = null; setSyncStatus("ok","云端暂无数据"); fullLoadOk = true; return true; }
    remoteSha = d.sha;
    const merged = { books: [] };
    const seen = {};
    /* 分卷可补充的字段：只补这些，不碰书的其他内容，避免旧分卷冲掉用户的新编辑 */
    const PATCH_FIELDS = ["cover", "startedAt", "finishedAt", "status"];
    const fieldOverrides = {};
    const addBooks = arr => (arr||[]).forEach(b => {
      if(b && b.id && !seen[b.id]){ seen[b.id] = 1; merged.books.push(b); }
      if(b && b.id){
        const patch = {};
        PATCH_FIELDS.forEach(f => { if(b[f] !== undefined && b[f] !== "") patch[f] = b[f]; });
        if(Object.keys(patch).length)
          fieldOverrides[b.id] = Object.assign(fieldOverrides[b.id] || {}, patch);
      }
    });
    const main = JSON.parse(b64decode(d.content));
    if(main && Array.isArray(main.books)) addBooks(main.books);
    for(let i=2; i<=9; i++){
      const p = partPath(i);
      let pd;
      try{ pd = await ghApiFor(p, "GET"); }
      catch(e){ setSyncStatus("error","分卷拉取失败，已阻止推送"); return false; }
      if(pd.notFound) break;
      const pdata = JSON.parse(b64decode(pd.content));
      if(pdata && Array.isArray(pdata.books)) addBooks(pdata.books);
      loadedParts.push({ path: p, sha: pd.sha });
    }
    /* 分卷只补充 patch 字段，不覆盖书的其他内容，避免旧分卷冲掉用户的新编辑 */
    merged.books.forEach(b => { if(fieldOverrides[b.id]) Object.assign(b, fieldOverrides[b.id]); });
    db = merged;
    localStorage.setItem(KEY, JSON.stringify(db));
    renderStats(); renderAll();
    setSyncStatus("ok"); fullLoadOk = true; return true;
  }catch(e){ setSyncStatus("error"); return false; }
}
let pushTimer = null;
function schedulePush(){
  if(!ghConfigured()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 2500);
}
async function pushNow(){
  if(!ghConfigured() || syncState === "syncing") return;
  if(!fullLoadOk) return; /* 未完整加载分卷时禁止推送，防止半份数据覆盖云端 */
  setSyncStatus("syncing");
  const tryPut = async () => {
    try{ const d = await ghApi("GET"); remoteSha = d.notFound ? null : d.sha; }catch(e){}
    const body = {
      message: "书架自动同步 " + new Date().toLocaleString("zh-CN"),
      content: b64encode(JSON.stringify(db))
    };
    if(remoteSha) body.sha = remoteSha;
    const r = await ghApi("PUT", body);
    if(r.content && r.content.sha) remoteSha = r.content.sha;
    /* 已合并进主卷的分卷文件清掉（失败也无妨，下次拉取按 id 去重依然正确） */
    for(const lp of loadedParts){
      try{ await ghApiFor(lp.path, "DELETE", { message: "分卷已合并入主文件", sha: lp.sha }); }catch(e){}
    }
    loadedParts = [];
  };
  try { await tryPut(); setSyncStatus("ok"); }
  catch(e){
    try { await tryPut(); setSyncStatus("ok"); }  // sha 冲突时重拉再试一次
    catch(e2){ setSyncStatus("error"); }
  }
}
function renderAll(){ if(currentBookId) renderBook(); else renderShelf(); }

function syncSettingsForm(){
  openModal(`
    <h2>☁️ 云端同步设置</h2>
    <div class="field"><label>GitHub 用户名</label>
      <input id="s_owner" value="${esc(cfg.owner || "yyh0422")}">
      <div class="help">Token 只保存在本机浏览器里，不会写进网页，别人打开这个页面看不到你的数据。</div></div>
    <div class="field"><label>私有仓库名</label>
      <input id="s_repo" value="${esc(cfg.repo || "")}" placeholder="如：my-notes">
      <div class="help">1. 在 GitHub 新建一个 <b>Private</b> 仓库（手机上也能建）<br>
      2. 头像 → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token<br>
      3. Repository access 选 Only select repositories，勾上这个仓库；Permissions 里 Contents 设为 Read and write<br>
      4. 生成后复制 token（只显示一次），粘贴到下面</div></div>
    <div class="field"><label>数据文件名</label>
      <input id="s_path" value="${esc(cfg.path || "bookshelf.json")}"></div>
    <div class="field"><label>Token</label>
      <input id="s_token" type="password" value="${esc(cfg.token || "")}" placeholder="粘贴 token"></div>
    <div class="btnrow" style="justify-content:flex-start">
      <button class="btn small ghost" id="s_pull">从云端拉取</button>
      <button class="btn small ghost" id="s_push">推送到云端</button>
      ${ghConfigured()?'<button class="linkbtn danger" id="s_clear">断开同步</button>':""}
    </div>
    <div class="btnrow">
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn" id="mSave">保存</button>
    </div>`);
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mSave").onclick = async () => {
    cfg = {
      owner: document.getElementById("s_owner").value.trim() || "yyh0422",
      repo: document.getElementById("s_repo").value.trim(),
      path: document.getElementById("s_path").value.trim() || "bookshelf.json",
      token: document.getElementById("s_token").value.trim()
    };
    saveCfg(); closeModal();
    if(ghConfigured()){ await pullRemote(); schedulePush(); }
    else setSyncStatus("off");
  };
  document.getElementById("s_pull").onclick = async () => {
    cfg.token = document.getElementById("s_token").value.trim();
    cfg.repo = document.getElementById("s_repo").value.trim();
    cfg.owner = document.getElementById("s_owner").value.trim() || "yyh0422";
    cfg.path = document.getElementById("s_path").value.trim() || "bookshelf.json";
    const ok = await pullRemote();
    alert(ok ? "已从云端拉取最新数据" : "拉取失败，请检查仓库名和 token");
  };
  document.getElementById("s_push").onclick = async () => {
    cfg.token = document.getElementById("s_token").value.trim();
    cfg.repo = document.getElementById("s_repo").value.trim();
    cfg.owner = document.getElementById("s_owner").value.trim() || "yyh0422";
    cfg.path = document.getElementById("s_path").value.trim() || "bookshelf.json";
    saveCfg(); await pushNow();
    alert(syncState === "ok" ? "已推送到云端" : "推送失败，请检查仓库名和 token");
  };
  const clr = document.getElementById("s_clear");
  if(clr) clr.onclick = () => {
    if(confirm("断开云端同步？本机数据会保留。")){ cfg = {}; saveCfg(); setSyncStatus("off"); closeModal(); }
  };
}

/* ---------- 统计 / 书架 / 详情（同前） ---------- */
function counts(){
  let e = 0; db.books.forEach(b => e += (b.excerpts||[]).length);
  return { books: db.books.length, excerpts: e };
}
function renderStats(){
  const c = counts();
  document.getElementById("statsText").textContent = `共 ${c.books} 本书 · ${c.excerpts} 条摘抄`;
}
function stars(n){ n = n||0; return "★".repeat(n) + "☆".repeat(5-n); }
function bookMatches(b, q){
  if(!q) return true;
  q = q.toLowerCase();
  if((b.title+" "+(b.author||"")+" "+(STATUS[b.status]||"")).toLowerCase().includes(q)) return true;
  return (b.excerpts||[]).some(x => ((x.text||"")+" "+(x.ref||"")+" "+(x.note||"")).toLowerCase().includes(q));
}
function allTags(){
  const m = {};
  db.books.forEach(b => (b.tags||[]).forEach(t => { if(t) m[t] = (m[t]||0)+1; }));
  return Object.entries(m).sort((a,b) => b[1]-a[1] || String(a[0]).localeCompare(String(b[0]),"zh"));
}
function renderShelf(){
  currentBookId = null;
  document.getElementById("bookView").style.display = "none";
  const v = document.getElementById("shelfView");
  v.style.display = "";
  const q = document.getElementById("q").value.trim();
  const tags = allTags();
  if(selectedTag && !tags.some(([t]) => t === selectedTag)) selectedTag = "";
  const books = db.books.filter(b => bookMatches(b, q) && (!selectedTag || (b.tags||[]).includes(selectedTag)));
  let html = "";
  if(tags.length){
    html += `<div class="tagrow"><button class="tagpill ${!selectedTag?"on":""}" data-tag="">全部</button>` +
      tags.map(([t,n]) => `<button class="tagpill ${selectedTag===t?"on":""}" data-tag="${esc(t)}">${esc(t)} <span class="n">${n}</span></button>`).join("") + `</div>`;
  }
  if(!books.length){
    html += `<div class="empty">${(q||selectedTag) ? "没有找到匹配的内容" : "书架还是空的，<br>点「＋ 添加图书」开始记录第一本书吧"}</div>`;
  } else {
    html += books.map(b => `
    <div class="card book-card" data-id="${b.id}">
      <div class="book-head">
        ${coverHTML(b)}
        <div style="flex:1;min-width:0">
          <p class="book-title">${esc(b.title)}</p>
          <div class="book-meta">
            ${b.author?`<span>${esc(b.author)}</span>`:""}
            <span class="badge ${b.status==="done"?"done":b.status==="dropped"?"drop":""}">${STATUS[b.status]||"在读"}</span>
            ${b.rating?`<span class="stars">${stars(b.rating)}</span>`:""}
            <span>${(b.excerpts||[]).length} 条摘抄</span>
          </div>
          ${(b.tags&&b.tags.length)?`<div class="booktags">${b.tags.map(t=>`<span class="t">${esc(t)}</span>`).join("")}</div>`:""}
        </div>
      </div>
    </div>`).join("");
  }
  v.innerHTML = html;
  v.querySelectorAll(".tagpill").forEach(el =>
    el.addEventListener("click", () => { selectedTag = el.dataset.tag; renderShelf(); }));
  v.querySelectorAll(".book-card").forEach(el =>
    el.addEventListener("click", () => openBook(el.dataset.id)));
}
function barRow(label, n, max){
  const pct = max ? Math.round(n/max*100) : 0;
  return `<div class="bar-row"><div class="bl">${esc(label)}</div><div class="bt"><div class="bf" style="width:${pct}%"></div></div><div class="bv">${n}</div></div>`;
}
function statsModal(){
  const c = counts();
  const notes = db.books.reduce((n,b) => n + (b.excerpts||[]).filter(x => String(x.note||"").trim()).length, 0);
  const st = {reading:0, done:0, dropped:0};
  db.books.forEach(b => { st[b.status] = (st[b.status]||0)+1; });
  const tags = allTags();
  const months = []; const now = new Date();
  for(let i=11;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    months.push({key, label:(d.getMonth()+1)+"月", n:0});
  }
  const mmap = {}; months.forEach(m => mmap[m.key]=m);
  db.books.forEach(b => { const k = String(b.finishedAt||"").slice(0,7); if(mmap[k]) mmap[k].n++; });
  const maxm = Math.max(1, ...months.map(m=>m.n));
  const maxTag = Math.max(1, ...tags.map(([t,n])=>n));
  openModal(`
    <h2>📊 阅读统计</h2>
    <div class="statgrid">
      <div class="statbox"><div class="v">${c.books}</div><div class="l">本书</div></div>
      <div class="statbox"><div class="v">${c.excerpts}</div><div class="l">条摘抄</div></div>
      <div class="statbox"><div class="v">${notes}</div><div class="l">条笔记</div></div>
      <div class="statbox"><div class="v">${db.books.filter(b=>(b.rating||0)>=4).length}</div><div class="l">四星以上</div></div>
    </div>
    <h2 style="font-size:15px;margin:18px 0 6px">状态分布</h2>
    ${["reading","done","dropped"].map(k=>barRow(STATUS[k], st[k]||0, c.books)).join("")}
    ${tags.length?`<h2 style="font-size:15px;margin:18px 0 6px">标签 TOP</h2>`+tags.slice(0,8).map(([t,n])=>barRow(t,n,maxTag)).join(""):""}
    <h2 style="font-size:15px;margin:18px 0 6px">近12个月读完</h2>
    ${months.map(m=>barRow(m.label,m.n,maxm)).join("")}
    <div class="btnrow"><button class="btn" id="mCancel">关闭</button></div>`);
  document.getElementById("mCancel").onclick = closeModal;
}
function openBook(id){ currentBookId = id; renderBook(); }
function renderBook(){
  const b = db.books.find(x => x.id === currentBookId);
  if(!b){ renderShelf(); return; }
  document.getElementById("shelfView").style.display = "none";
  const v = document.getElementById("bookView");
  v.style.display = "";
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = (b.excerpts||[]).filter(x => !q ||
    ((x.text||"")+" "+(x.ref||"")+" "+(x.note||"")).toLowerCase().includes(q));
  v.innerHTML = `
    <button class="backbtn" id="backBtn">‹ 返回书架</button>
    <div class="card">
      <div class="book-head">
        ${coverHTML(b, "lg")}
        <div style="flex:1;min-width:0">
          <p class="book-title">${esc(b.title)}</p>
          <div class="book-meta">
            ${b.author?`<span>作者：${esc(b.author)}</span>`:""}
            <span class="badge ${b.status==="done"?"done":b.status==="dropped"?"drop":""}">${STATUS[b.status]||"在读"}</span>
            ${b.rating?`<span class="stars">${stars(b.rating)}</span>`:""}
          </div>
          ${(b.startedAt||b.finishedAt)?`<div class="book-meta" style="margin-top:6px">
            ${b.startedAt?`<span>开始：${esc(b.startedAt)}</span>`:""}
            ${b.finishedAt?`<span>读完：${esc(b.finishedAt)}</span>`:""}</div>`:""}
        </div>
      </div>
      <div class="btnrow">
        <button class="btn small ghost" id="addExcerptBtn">＋ 加摘抄</button>
        <button class="btn small ghost" id="editBookBtn">编辑图书</button>
        <button class="linkbtn danger" id="delBookBtn">删除本书</button>
      </div>
    </div>
    <div id="excerptList">
      ${list.length ? list.map(x => `
        <div class="excerpt">
          <div class="quote">${esc(x.text).replace(/\n/g,"<br>")}</div>
          ${x.ref?`<div class="ref">—— ${esc(x.ref)}</div>`:""}
          ${x.note?`<div class="note">${esc(x.note).replace(/\n/g,"<br>")}</div>`:""}
          <div class="ops">
            <button class="linkbtn" data-edit-ex="${x.id}">编辑</button>
            <button class="linkbtn danger" data-del-ex="${x.id}">删除</button>
          </div>
        </div>`).join("")
      : `<div class="empty">${q?"没有匹配的摘抄":"还没有摘抄，读到好句子就记下来吧"}</div>`}
    </div>`;
  document.getElementById("backBtn").onclick = renderShelf;
  document.getElementById("addExcerptBtn").onclick = () => excerptForm(b);
  document.getElementById("editBookBtn").onclick = () => bookForm(b);
  document.getElementById("delBookBtn").onclick = () => {
    if(confirm(`确定删除《${b.title}》及全部摘抄吗？`)){
      db.books = db.books.filter(x => x.id !== b.id);
      save(); renderStats(); renderShelf();
    }
  };
  v.querySelectorAll("[data-edit-ex]").forEach(el =>
    el.addEventListener("click", ev => { ev.stopPropagation();
      const x = b.excerpts.find(e => e.id === el.dataset.editEx); excerptForm(b, x); }));
  v.querySelectorAll("[data-del-ex]").forEach(el =>
    el.addEventListener("click", ev => { ev.stopPropagation();
      if(confirm("确定删除这条摘抄吗？")){
        b.excerpts = b.excerpts.filter(e => e.id !== el.dataset.delEx);
        save(); renderStats(); renderBook();
      }}));
}

/* ---------- 弹窗表单 ---------- */
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
function openModal(html){
  const r = document.getElementById("modalRoot");
  r.innerHTML = `<div class="modal-mask" id="mmask"><div class="modal">${html}</div></div>`;
  document.getElementById("mmask").addEventListener("click", e => {
    if(e.target.id === "mmask") closeModal();
  });
}
function starPickerHTML(cur){
  return `<div class="starpick" id="starpick">` +
    [1,2,3,4,5].map(i => `<span data-s="${i}" class="${i<=(cur||0)?"on":""}">★</span>`).join("") +
    `</div><input type="hidden" id="f_rating" value="${cur||0}">`;
}
function bookForm(b){
  const isNew = !b; b = b || {};
  openModal(`
    <h2>${isNew?"添加图书":"编辑图书"}</h2>
    <div class="field"><label>书名 *</label><input id="f_title" value="${esc(b.title||"")}"></div>
    <div class="field"><label>作者</label><input id="f_author" value="${esc(b.author||"")}"></div>
    <div class="field"><label>封面图片链接</label>
      <input id="f_cover" value="${esc(b.cover||"")}" placeholder="https://…" autocomplete="off">
      <div id="coverPrev" style="margin-top:8px"></div>
      <div class="help">粘贴图片链接即可；留空则显示标题占位图。</div></div>
    <div class="field"><label>状态</label><select id="f_status">
      ${Object.keys(STATUS).map(k=>`<option value="${k}" ${b.status===k?"selected":""}>${STATUS[k]}</option>`).join("")}
    </select></div>
    <div class="field"><label>标签（用逗号、顿号或空格分隔）</label><input id="f_tags" value="${esc((b.tags||[]).join("、"))}" placeholder="如：文学、历史"></div>
    <div class="field"><label>评分</label>${starPickerHTML(b.rating)}</div>
    <div class="daterow">
      <div class="field"><label>开始日期</label><input type="date" id="f_started" value="${esc(b.startedAt||"")}"></div>
      <div class="field"><label>读完日期</label><input type="date" id="f_finished" value="${esc(b.finishedAt||"")}"></div>
    </div>
    <div class="btnrow">
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn" id="mSave">保存</button>
    </div>`);
  document.getElementById("starpick").addEventListener("click", e => {
    const s = e.target.dataset.s; if(!s) return;
    document.getElementById("f_rating").value = s;
    document.querySelectorAll("#starpick span").forEach(sp =>
      sp.classList.toggle("on", +sp.dataset.s <= +s));
  });
  document.getElementById("mCancel").onclick = closeModal;
  const prevCover = () => {
    const u = document.getElementById("f_cover").value.trim();
    const box = document.getElementById("coverPrev");
    if(!u){ box.innerHTML = ""; return; }
    box.innerHTML = `<img class="cover-preview" src="${esc(u)}">`;
    box.querySelector("img").onerror = function(){
      box.innerHTML = `<div style="font-size:12px;color:var(--red)">图片加载失败，请检查链接</div>`;
    };
  };
  document.getElementById("f_cover").addEventListener("input", prevCover);
  prevCover();
  document.getElementById("mSave").onclick = () => {
    const title = document.getElementById("f_title").value.trim();
    if(!title){ alert("请填写书名"); return; }
    const data = {
      title,
      author: document.getElementById("f_author").value.trim(),
      cover: document.getElementById("f_cover").value.trim(),
      status: document.getElementById("f_status").value,
      rating: +document.getElementById("f_rating").value,
      startedAt: document.getElementById("f_started").value,
      finishedAt: document.getElementById("f_finished").value,
      tags: [...new Set(document.getElementById("f_tags").value.split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean))],
    };
    if(isNew){
      db.books.unshift(Object.assign({ id: uid(), excerpts: [], createdAt: Date.now() }, data));
    } else Object.assign(b, data);
    save(); closeModal(); renderStats(); renderAll();
  };
}
function excerptForm(b, x){
  const isNew = !x; x = x || {};
  openModal(`
    <h2>${isNew?"添加摘抄":"编辑摘抄"}</h2>
    <div class="field"><label>摘抄内容 *</label>
      <textarea class="tall" id="f_text">${esc(x.text||"")}</textarea></div>
    <div class="field"><label>出处（章节 / 页码）</label>
      <input id="f_ref" value="${esc(x.ref||"")}" placeholder="如：第3章 / p.42"></div>
    <div class="field"><label>我的笔记</label>
      <textarea id="f_note" placeholder="针对这段摘抄的想法…">${esc(x.note||"")}</textarea></div>
    <div class="btnrow">
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn" id="mSave">保存</button>
    </div>`);
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mSave").onclick = () => {
    const text = document.getElementById("f_text").value.trim();
    if(!text){ alert("请填写摘抄内容"); return; }
    const data = {
      text,
      ref: document.getElementById("f_ref").value.trim(),
      note: document.getElementById("f_note").value.trim(),
    };
    if(isNew){
      b.excerpts = b.excerpts || [];
      b.excerpts.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
    } else Object.assign(x, data);
    save(); closeModal(); renderStats(); renderBook();
  };
}

/* ---------- 备份 / 恢复 ---------- */
function doExport(){
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const d = new Date();
  const name = `书架备份-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function doImport(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      if(isKindleExport(data)){ importKindle(data); return; }
      if(!data || !Array.isArray(data.books)) throw 0;
      const have = new Set(db.books.map(b => b.id));
      let n = 0;
      data.books.forEach(b => {
        if(b && b.id && !have.has(b.id) && b.title){
          b.excerpts = Array.isArray(b.excerpts) ? b.excerpts : [];
          db.books.push(b); have.add(b.id); n++;
        }
      });
      save(); renderStats(); renderAll();
      alert(`导入完成，新增 ${n} 本书`);
    }catch(e){ alert("文件格式不对，请选择书架备份或 Kindle 导出的 JSON"); }
  };
  rd.readAsText(file);
}
/* ---------- Kindle 标注导入 ---------- */
function isKindleExport(data){
  if(!data || !Array.isArray(data.books) || !data.books.length) return false;
  if(typeof data.source === "string" && data.source.indexOf("read.amazon") !== -1) return true;
  const b0 = data.books[0];
  return data.version === 1 && b0 && Array.isArray(b0.highlights);
}
function importKindle(data){
  let nb = 0, nh = 0;
  data.books.forEach(kb => {
    if(!kb || !kb.title) return;
    const key = String(kb.title).toLowerCase();
    let b = db.books.find(x => String(x.title||"").toLowerCase() === key);
    if(!b){
      b = { id: uid(), title: kb.title, author: kb.author || "", status: "reading",
            rating: 0, startedAt: "", finishedAt: "", excerpts: [], createdAt: Date.now() };
      if(kb.asin) b.asin = kb.asin;
      db.books.unshift(b); nb++;
    }
    b.excerpts = b.excerpts || [];
    const haveText = new Set(b.excerpts.map(e => String(e.text||"").trim()));
    (kb.highlights || []).forEach(h => {
      const t = String((h && h.text) || "").trim();
      if(!t || haveText.has(t)) return;
      b.excerpts.push({ id: uid(), text: t,
        ref: String((h && h.reference) || "").trim(), note: "", createdAt: Date.now() });
      haveText.add(t); nh++;
    });
  });
  save(); renderStats(); renderAll();
  alert(`Kindle 导入完成：新增 ${nb} 本书，新增 ${nh} 条标注`);
}


/* ---------- 事件 ---------- */
document.getElementById("addBookBtn").onclick = () => bookForm(null);
document.getElementById("statsBtn").onclick = statsModal;
document.getElementById("syncBtn").onclick = syncSettingsForm;
document.getElementById("exportBtn").onclick = doExport;
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change", e => {
  if(e.target.files[0]) doImport(e.target.files[0]);
  e.target.value = "";
});
document.getElementById("q").addEventListener("input", renderAll);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && ghConfigured()){
    clearTimeout(pushTimer); pushNow();
  }
});

/* ---------- 启动 ---------- */
renderStats();
renderShelf();
setSyncStatus(ghConfigured() ? "syncing" : "off");
if(ghConfigured()) pullRemote();
</script>
